# missing_box negative control (RoboCI M3, fork file): the same box as
# avoid_box, absent from the planning scene (box_in_scene false). Must
# fail on no_collision while MoveIt reports success.
version: "1"

environment:
  ros_distro: jazzy
  build:
    rosdep: true
    repos: [roboci/roboci_omx.repos]

robot:
  launch: roboci/omx_moveit.launch.py
  launch_args:
    world: "${world}"
    box_in_scene: "false"
    box_center: "0.20 0.02 0.08"
    box_size: "0.015 0.10 0.16"
  model: open_manipulator_x
  stack: moveit
  planning_group: arm
  end_effector_link: end_effector_link
  base_frame: link1
  sensors:
    joints: { topic: /joint_states, type: joint_state }

worlds:
  empty:
    file: open_manipulator_bringup/worlds/empty_world.sdf
    map_pose: { x: 0.0, y: 0.0 }

defaults:
  timeout: 240s

scenarios:
  - name: missing_box
    description: The planning scene omits the box; the arm must hit it.
    world: empty
    seeds: [1, 2, 3]
    steps:
      - spawn_object: { name: target_box, shape: box, size: [0.015, 0.10, 0.16], mass: 0.5, friction: 1.0,
                        pose: { x: 0.20, y: 0.02, z: 0.08 } }
      - move_to_named: { name: home, plan_attempts: 3 }
      - move_to_pose: { x: 0.27, y: 0.05, z: 0.04, plan_attempts: 3 }
    assertions:
      - reached_pose: { tolerance: 1cm }
      - no_collision: {}
      - no_self_collision: {}
