# avoid_box (RoboCI M3, fork file) -- BLOCKED on the X, kept as the
# attempt record. Nine geometries tried (boxes, poles, a thin panel,
# goals past/beside/above, with and without a seeding waypoint, pose
# and joint goals): every goal past an obstacle on the straight path
# either starts/ends in collision (the 4 cm palm always overlaps the
# obstacle face at reachable goals) or, when a free state exists, KDL
# only samples the colliding near-seed basin and reports Invalid goal
# state. The 28 cm workspace cannot fit obstacle + palm + sampling
# margin. missing_box (same panel, no scene) still validates the
# scene-monitoring path: MoveIt SUCCEEDS and RoboCI catches the
# contact. See the M3 scorecard for the full evidence trail.
version: "1"

environment:
  ros_distro: jazzy
  build:
    rosdep: true
    repos: [roboci/roboci_omx.repos]

robot:
  launch: roboci/omx_moveit.launch.py
  launch_args:
    world: "${world}"
    box_in_scene: "true"
    box_center: "0.20 0.02 0.08"
    box_size: "0.015 0.10 0.16"
  model: open_manipulator_x
  stack: moveit
  planning_group: arm
  end_effector_link: end_effector_link
  base_frame: link1
  sensors:
    joints: { topic: /joint_states, type: joint_state }

worlds:
  empty:
    file: open_manipulator_bringup/worlds/empty_world.sdf
    map_pose: { x: 0.0, y: 0.0 }

defaults:
  timeout: 240s

scenarios:
  - name: avoid_box
    description: Reach past the target box, which the planner must avoid.
    world: empty
    seeds: [1, 2, 3]
    steps:
      - spawn_object: { name: target_box, shape: box, size: [0.015, 0.10, 0.16], mass: 0.5, friction: 1.0,
                        pose: { x: 0.20, y: 0.02, z: 0.08 } }
      - move_to_named: { name: home, plan_attempts: 3 }
      # Joint goal, not a pose goal: the X's KDL sampler only returns
      # near-seed IK solutions, which collide here, so a pose goal can
      # never sample a free state in this workspace. These joints are the
      # missing run's reached values (tip at the goal, elbow clear of
      # the panel); OMPL still has to route around the panel to get
      # there, which is what this scenario tests.
      - move_joints: { joints: { joint1: 0.19, joint2: 0.23, joint3: 0.39, joint4: -0.08 }, plan_attempts: 3 }
    assertions:
      - reached_pose: { tolerance: 1cm, x: 0.27, y: 0.05, z: 0.04 }
      - no_collision: {}
      - no_self_collision: {}
